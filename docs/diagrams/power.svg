<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"><style>svg{--pcb:#123d2e;--pcb-edge:#1f5c45;--silk:#eef1ea;--silk-dim:#8fa097;--wire-power:#d9a35f;--wire-gnd:#7b8a82;--wire-warn:#e2666a;--c-red:#e5484d;--c-black:#161a18;--c-white:#f4f4f4;--c-blue:#3b82f6;--c-yellow:#eab308;--c-green:#22c55e;--c-orange:#f97316;--c-brown:#a35a2a;--c-purple:#a855f7;--c-grey:#9ca3af;--c-pink:#ec4899;--c-teal:#14b8a6;}</style><rect x="0.0" y="0.0" width="1200.0" height="330.0" fill="#0c1210"/><rect x="40" y="41" width="170" height="18" rx="9" fill="none" stroke="var(--c-orange)" stroke-width="1.6"/><text x="125.0" y="54" text-anchor="middle" font-size="10.5" fill="var(--c-orange)" font-weight="600">5 V 4 A wall adapter</text><line x1="210" y1="50" x2="270" y2="50" stroke="var(--c-orange)" stroke-width="4"/><rect x="270" y="41" width="150" height="18" rx="9" fill="none" stroke="var(--c-orange)" stroke-width="1.6"/><text x="345.0" y="54" text-anchor="middle" font-size="10.5" fill="var(--c-orange)" font-weight="600">DC jack, 12 mm</text><line x1="420" y1="50" x2="470" y2="50" stroke="var(--c-orange)" stroke-width="4"/><rect x="470" y="41" width="90" height="18" rx="9" fill="none" stroke="var(--c-orange)" stroke-width="1.6"/><text x="515.0" y="54" text-anchor="middle" font-size="10.5" fill="var(--c-orange)" font-weight="600">fuse</text><line x1="560" y1="50" x2="620" y2="50" stroke="var(--c-orange)" stroke-width="4"/><rect x="620" y="18" width="190" height="64" rx="5" fill="var(--pcb)" stroke="var(--pcb-edge)" stroke-width="2"/><text x="715.0" y="38" text-anchor="middle" font-size="11" fill="var(--silk)" font-weight="600">5 V RAIL</text><text x="715.0" y="52" text-anchor="middle" font-size="9" fill="var(--silk-dim)">1000 µF across it</text><text x="860" y="106" text-anchor="start" font-size="10.5" fill="var(--silk-dim)">everything below is fed from the rail</text><path d="M 810 50 L 840 50 L 840 130 L 860 130" fill="none" stroke="var(--c-orange)" stroke-width="2" stroke-linejoin="round"/><rect x="860" y="121" width="190" height="18" rx="9" fill="none" stroke="var(--c-orange)" stroke-width="1.6"/><text x="955.0" y="134" text-anchor="middle" font-size="10" fill="var(--c-orange)" font-weight="600">Left strip pixels</text><text x="1060" y="134" text-anchor="start" font-size="10" fill="var(--silk-dim)">LS 20, 21</text><path d="M 810 50 L 840 50 L 840 170 L 860 170" fill="none" stroke="var(--c-orange)" stroke-width="2" stroke-linejoin="round"/><rect x="860" y="161" width="190" height="18" rx="9" fill="none" stroke="var(--c-orange)" stroke-width="1.6"/><text x="955.0" y="174" text-anchor="middle" font-size="10" fill="var(--c-orange)" font-weight="600">Right strip pixels</text><text x="1060" y="174" text-anchor="start" font-size="10" fill="var(--silk-dim)">RS 20, 21</text><path d="M 810 50 L 840 50 L 840 210 L 860 210" fill="none" stroke="var(--c-orange)" stroke-width="2" stroke-linejoin="round"/><rect x="860" y="201" width="190" height="18" rx="9" fill="none" stroke="var(--c-orange)" stroke-width="1.6"/><text x="955.0" y="214" text-anchor="middle" font-size="10" fill="var(--c-orange)" font-weight="600">Left wing: fader driver</text><text x="1060" y="214" text-anchor="start" font-size="10" fill="var(--silk-dim)">LW 20, 21</text><path d="M 810 50 L 840 50 L 840 250 L 860 250" fill="none" stroke="var(--c-orange)" stroke-width="2" stroke-linejoin="round"/><rect x="860" y="241" width="190" height="18" rx="9" fill="none" stroke="var(--c-orange)" stroke-width="1.6"/><text x="955.0" y="254" text-anchor="middle" font-size="10" fill="var(--c-orange)" font-weight="600">32 fuel pixels (middle)</text><text x="1060" y="254" text-anchor="start" font-size="10" fill="var(--silk-dim)">direct, short wire</text><path d="M 810 50 L 840 50 L 840 290 L 860 290" fill="none" stroke="var(--c-orange)" stroke-width="2" stroke-linejoin="round"/><rect x="860" y="281" width="190" height="18" rx="9" fill="none" stroke="var(--c-orange)" stroke-width="1.6"/><text x="955.0" y="294" text-anchor="middle" font-size="10" fill="var(--c-orange)" font-weight="600">74AHCT125 level shifter</text><text x="1060" y="294" text-anchor="start" font-size="10" fill="var(--silk-dim)">direct</text><text x="40" y="150" text-anchor="start" font-size="11" fill="var(--wire-power)">Teensy: USB only.</text><text x="40" y="170" text-anchor="start" font-size="10" fill="var(--silk-dim)">Never connect the 5 V rail to the</text><text x="40" y="184" text-anchor="start" font-size="10" fill="var(--silk-dim)">Teensy&#x27;s VIN while USB is plugged in.</text><rect x="40" y="221" width="46" height="18" rx="9" fill="none" stroke="var(--wire-gnd)" stroke-width="1.6"/><text x="63.0" y="234" text-anchor="middle" font-size="10.5" fill="var(--wire-gnd)" font-weight="600">GND</text><text x="96" y="234" text-anchor="start" font-size="10" fill="var(--silk-dim)">one ground, shared by the adapter, the Teensy and every piece</text><rect x="40" y="253" width="46" height="18" rx="9" fill="none" stroke="var(--c-red)" stroke-width="1.6"/><text x="63.0" y="266" text-anchor="middle" font-size="10.5" fill="var(--c-red)" font-weight="600">3V3</text><text x="96" y="266" text-anchor="start" font-size="10" fill="var(--silk-dim)">from the Teensy only: pots, buzzer module and OLEDs</text></svg>