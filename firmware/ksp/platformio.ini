; Teensy 4.1 firmware for the KSP controller. Build: pio run -d firmware/ksp   Upload: pio run -d firmware/ksp -t upload
; Not built or tested yet: the library pin below was checked to exist on GitHub, nothing more.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

; The Simpit Arduino library is not in the PlatformIO registry, so it is pinned to a release tag on GitHub.
; The KSP mod's own latest release is v2.3.1 and the library's is v2.4.0: check the two pair up before first use.
; WS2812Serial and Wire ship with the Teensy framework. FastTouch (fader touch sensing) is still to be chosen and added.
lib_deps =
    KerbalSimpit=https://github.com/Simpit-team/KerbalSimpitRevamped-Arduino.git#v2.4.0
